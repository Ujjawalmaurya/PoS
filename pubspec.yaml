name: pos
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.3+1

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  csv: ^5.0.2
  file_picker: ^5.3.3
  excel: ^2.1.0
  flutter:
    sdk: flutter
  get_storage: ^2.1.1
  http:
  image_picker: ^1.0.1
  intl: ^0.18.0
  permission_handler: ^10.4.3
  pinput: ^3.0.0
  pdf: ^3.10.4
  path_provider: ^2.1.0
  open_file: ^3.3.2
  mobile_scanner: ^3.4.1
  dotted_border: ^2.0.0+3
  get: ^4.6.6
  printing: ^5.11.0
  uuid:
  flutter_slidable: ^3.0.0
  share_plus:

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
  #   - images/a_dot_ham.jpeg
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900
